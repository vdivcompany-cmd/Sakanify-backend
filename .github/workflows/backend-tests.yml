name: Sakanify Backend — Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}  # allows manually triggering a run from the GitHub Actions tab

jobs:
  test:
    name: Run Backend Test Suite
    runs-on: ubuntu-latest

    # Spins up a real, temporary MongoDB instance for this run only —
    # not connected to the real Atlas production database.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MongoDB to be ready
        run: |
          for i in {1..10}; do
            mongosh --host localhost:27017 --eval "db.runCommand({ ping: 1 })" && break
            echo "Waiting for MongoDB..."
            sleep 3
          done

      - name: Run test suite
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/sakanify_test
          JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
          JWT_ACCESS_EXPIRY: 15m
          JWT_REFRESH_EXPIRY: 7d
          OTP_EXPIRY: 300
          OTP_MAX_ATTEMPTS: 3

      - name: Run health-check smoke test
        run: |
          npm start &
          sleep 5
          curl -f http://localhost:5000/health || (echo "Health check failed" && exit 1)
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/sakanify_test
          JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
          PORT: 5000
